<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Run judge annotations</title>
<style>body{font:15px system-ui;background:#111827;color:#e5e7eb;max-width:1300px;margin:30px auto;padding:0 20px}a{color:#93c5fd}select,button{padding:8px;background:#263348;color:white;border:1px solid #53637c;border-radius:5px}table{border-collapse:collapse;width:100%;margin-top:20px}td,th{text-align:left;border-bottom:1px solid #374151;padding:10px}pre{white-space:pre-wrap;background:#1f2937;padding:16px;overflow-wrap:anywhere}#list{max-height:45vh;overflow:auto}.note{color:#aebbd0}</style>
<h1>Failure and inefficiency annotations</h1><p class="note">Simulator scores are authoritative. Confidence is model-reported and uncalibrated. Annotations remain unreviewed until you review them.</p>
<p id="status">Loading…</p><select id="baseline" aria-label="Baseline"><option value="">All five baselines</option><option>react</option><option>react-no-image</option><option>vlm-tamp</option><option>vlm-tamp-no-image</option><option>tru-pomdp</option></select> <select id="state" aria-label="Annotation state"><option value="">All runs</option><option>annotated</option><option>not_annotated</option></select> <button id="refresh">Refresh</button> <a href="runs.csv">Runs CSV</a> · <a href="incidents.csv">Incidents CSV</a> · <a href="review_template.json">Human review template</a>
<div id="list"><table><thead><tr><th>Variant</th><th>Baseline</th><th>Repeat</th><th>Simulator</th><th>Annotation</th><th>Labels</th></tr></thead><tbody id="rows"></tbody></table></div><div id="detail"></div>
<script>
let runs=[];const $=x=>document.getElementById(x);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const url=x=>x.split('/').map(encodeURIComponent).join('/');
function render(){const selected=runs.filter(r=>(!$('baseline').value||r.baseline===$('baseline').value)&&(!$('state').value||r.annotation_status===$('state').value));$('rows').innerHTML=selected.map(r=>`<tr><td><button data-id="${esc(r.id)}">${esc(r.episode_id)}</button></td><td>${esc(r.baseline)}</td><td>${r.repetition}</td><td>${esc(r.simulator_outcome??'—')}</td><td>${esc(r.annotation_status)}</td><td>${esc((r.labels??[]).join(', '))}</td></tr>`).join('');}
async function refresh(){try{const r=await fetch('summary.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error(r.status);const d=await r.json();runs=d.runs;$('status').textContent=`${d.annotated} / ${d.total_runs} annotated · exported ${d.updated}`;render();}catch(e){$('status').textContent='No summary yet. Run the export command. '+e.message;}}
$('rows').onclick=async e=>{const id=e.target.dataset.id;if(!id)return;const run=runs.find(r=>r.id===id);const packet='packets/'+url(id)+'.json';let html=`<h2>${esc(id)}</h2><a target="_blank" href="${packet}">Structured evidence input</a> · <a target="_blank" href="requests/${url(id)}.json">Exact request</a>`;if(run.analysis_file){const r=await fetch(url(run.analysis_file));if(r.ok){const d=await r.json();html+=` · <a target="_blank" href="${url(run.analysis_file)}">Structured output</a><p>${esc(d.analysis.summary)}</p>`;for(const family of ['failures','inefficiencies']){html+=`<h3>${family}</h3>`;for(const x of d.analysis[family])html+=`<p><strong>${esc(x.label)}</strong> · confidence ${x.confidence_raw} · ${esc(x.id)}</p><p>${esc(x.explanation)}</p><pre>${esc(JSON.stringify(x,null,2))}</pre>`;}html+=`<details><summary>Simulator criteria, notes, coverage and provenance</summary><pre>${esc(JSON.stringify(d,null,2))}</pre></details>`;}}$('detail').innerHTML=html;};
$('baseline').onchange=render;$('state').onchange=render;$('refresh').onclick=refresh;refresh();setInterval(refresh,15000);
</script></html>
