# RailPlanner: VLM-TAMP prompting/replanning with per-subgoal skill expanders
# instead of PDDLStream (habitat_llm/rail_planner). Same plan_config as VLM-TAMP.
defaults:
  - vlm_tamp_pddl_planner
  # ReAct LLM + prompt for the two_phase exploration phase (only instantiated when two_phase=true).
  - /llm@plan_config.explore_react.llm: openai_chat
  - /instruct@plan_config.explore_react.instruct: zero_shot_prompt
  - _self_

_target_: 'habitat_llm.rail_planner.RailPlanner'

plan_config:
  # When to re-query the VLM after a skill finishes, besides on failure/Explore:
  #   failure (default: no extra replans) | every_step | any_change | oracle
  # oracle uses privileged GT relevance rules (an upper bound, not deployable).
  # Proactive replans count toward max_vlm_cycles (default 20); raise it for
  # every_step / any_change runs.
  replan_trigger: failure
  max_proactive_replans: 30
  # Privileged placement oracle (an upper bound, not deployable): reads the
  # episode's is_on_top / is_inside / is_next_to goals.
  #   none | hint (destinations in the VLM prompt) | place (next_to in Place calls) | full
  placement_oracle: none
  # What to do when the active branch runs out of subgoals:
  #   none (default: stop, as in VLM-TAMP) | oracle (replan instead while the
  #   simulator's goal check is unmet; privileged upper bound, not deployable)
  #   | oracle_feedback (same, and tell the VLM which required objects it has
  #   not found and which known objects are not placed correctly / in state)
  #   | verify_symbolic (deployable: at plan end the VLM writes the final conditions the instruction
  #   requires from the instruction + robot memory, they are checked against the robot's scene state,
  #   and unmet or unconfirmable ones are fed back; habitat_llm/rail_planner/goal_verifier.py. Uses the
  #   same sim-synced open/closed and container-contents state as subgoal planning. One extra VLM call
  #   per check, not counted toward max_vlm_cycles.)
  end_of_plan_check: none
  max_end_of_plan_replans: 3
  # verify_symbolic only: also log the simulator's goal status and oracle feedback lines in each
  # end_of_plan_check event (*_shadow keys) to measure verifier precision/recall. Never shown to the planner.
  log_gt_shadow: true
  # Two-phase mode (deployable, no privileged information). Off by default; when false nothing below is used.
  # A VLM mode selector runs at every replan point (start, failure, plan finished, end of an exploration
  # phase) and picks explore (a ReAct phase with Explore/Navigate/Open/Close + Done[]) or interact (the loop
  # above, without explore(<room>) subgoals; it can ask for exploration with {"decision": "explore"}).
  # Top-down map of the house in the prompts (habitat_llm/rail_planner/overhead_map.py). Off by default.
  # Simulator ground truth is used for scene structure only (navmesh floor, room polygons, furniture
  # footprints); objects come from the robot's own world graph, drawn at the furniture/room it remembers.
  #   none | furniture (floor plan + furniture + robot/START/trail) | observed (+ remembered objects)
  #   | explored (+ unseen floor shaded, from the robot's own depth camera)
  overhead_map: none
  overhead_map_format: image     # image (default: only the map image) | text | both (adds a metric text block:
                                 # rooms, furniture size/height/walls, start room)
  overhead_map_cfg:
    meters_per_pixel: 0.05
    max_side_px: 1024
    label: receptacles           # receptacles (furniture with placement surfaces) | all
    explored_every: 10           # sim steps between depth projections (explored only)
    max_depth_m: 6.0
    max_text_chars: 12000
    attach_to: [turn1, selector, explorer]   # selector/explorer only matter with two_phase=true
  # Object-centric subgoals (deployable, no privileged information). Off by default (flat = unchanged).
  # object_centric: the VLM first lists abstract object tasks (one per object or object group, with the
  # conditions it must end in, no IDs); each is then grounded with the usual Turn 1/Turn 2 + expanders and
  # executed in turn, using the memory at that moment; a final review confirms completion or adds tasks.
  subgoal_mode: flat             # flat | object_centric
  object_task_max_regrounds: 4   # failure re-groundings of one object task before it is skipped
  object_task_max_reviews: 2     # final reviews that may add object tasks
  # next_to(obj, ref, furniture) subgoal (defined in vlm_tamp_pddl_planner.yaml, off there). On for RailPlanner;
  # VLM-TAMP keeps its own default.
  next_to_subgoal: true
  two_phase: false
  max_explore_phases: 6          # after this the selector is skipped and interact is forced
  explore_phase_max_skills: 10   # ReAct skills per exploration phase (each counts toward max_actions)
  explore_react:                 # plan_config of the embedded ZeroShotReactPlanner
    llm:
      generation_params:
        model: gpt-5.6-luna
        reasoning_effort: high
    send_action_image: true
    objects_response: true
    objects_response_include_states: true
    planning_mode: cot
    constrained_generation: false
    replanning_threshold: 200    # cumulative ReAct LLM calls over all phases; phases are capped above
    placement_oracle: none
    centralized: false
    fast_explore: false
    enable_rag: false
    example_type: react
