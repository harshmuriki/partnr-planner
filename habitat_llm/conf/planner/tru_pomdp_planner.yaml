defaults:
  - /llm@plan_config.llm: openai_chat
  - _self_

_target_: 'habitat_llm.planner.TruPOMDPPlanner'
_recursive_: False
_partial_: True

plan_config:
    # -- Tree of Hypotheses (paper Appendix A.5) --------------------------------
    c1: 3                    # Level 1/2 candidate combinations
    c2: 3                    # Level 3 candidate locations per invisible object
    max_goal_objects: null      # no truncation of complete goals
    max_particles: 48        # cap on root-to-leaf paths kept in the belief
    toh_max_tokens: 4096     # the A.1 prompts ask for a long reasoning chain

    # -- Hybrid belief update --------------------------------------------------
    replenish_threshold: 0.3 # regenerate TOH when surviving mass drops below this
    # Only verified coverage (currently successful Open) refutes by absence.
    # Navigation and Explore do not certify exhaustive visibility. True also
    # trusts areas containing an observed object; use only with complete sensing.
    trust_observed_areas: False

    # -- DESPOT ----------------------------------------------------------------
    num_scenarios: 30        # k
    max_search_depth: 20     # d_s
    rollout_depth: 10        # d_r
    discount: 0.95
    xi: 0.95                 # target fraction of root uncertainty
    num_trials: 500
    planning_time_s: 1.0     # anytime budget per decision
    seed: 0

    # -- Execution -------------------------------------------------------------
    max_decisions: 50        # high-level actions before the planner gives up
    max_place_targets: 8     # open areas offered for a temporary placement
    navigation_threshold: 1.5 # metres; beyond this an implicit Navigate is issued
    verbose: False

    centralized: False
    enable_rag: False
