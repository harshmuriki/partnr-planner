_target_: 'habitat_llm.planner.CustomApproachPlanner'
_recursive_: False
_partial_: True

plan_config:
  pddl_baseline: True
  subgoal_action_backend: vlm
  custom_action_executor: pddlstream
  num_branches: 1
  max_reprompts: 0
  ntamp_max_pddl_replan_retries: 2
  max_pddl_replans_per_subgoal: 2
  max_vlm_action_reprompts_per_subgoal: 2
  skip_failed_subgoals: True
  enable_partial_obs_explore: True
  explore_on_missing_required_objects: True
  enable_vlm_explore_subgoal: True
  max_room_explore_passes_per_object: 2
  explore_fast: True
  verbose: True
  print_custom_pipeline_details: True
  log_dir: "custom_approach"
  vlm:
    type: gpt4v
    model_name: gpt-5.6-luna
    max_completion_tokens: 1200
    temperature: 0.2
    use_images: True
    use_gt_bboxes: True
    gt_bbox_image_panels: 2
    write_log_html: True
    write_planning_tree_png: True
    planning_tree_show_failure_labels: True
    planning_tree_failure_label_mode: "flag"
    cache_path: null
